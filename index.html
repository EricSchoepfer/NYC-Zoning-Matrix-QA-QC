<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Custom Zoning Matrix Builder</title>
    <style>
        :root { --primary-color: #1e3a8a; --accent-color: #0d9488; --bg-main: #f3f4f6; --border-color: #e5e7eb; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-main); color: #1f2937; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h2 { color: var(--primary-color); margin-top: 0; }
        select, input[type="number"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 15px; width: 100%; font-size: 1.1rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0f766e; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
        th { background-color: #f9fafb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>1. Property Parameters</h2>
            <form id="zoningForm">
                <div class="grid">
                    <div><label>District</label><select id="primaryDistrict"><option>R7X</option><option>R10</option></select></div>
                    <div><label>Lot Area (SF)</label><input type="number" id="lotArea" value="10180"></div>
                </div>
                <button type="button" id="generateMatrixBtn">Calculate Matrix</button>
            </form>
        </div>
        <section id="matrixOutputWrapper" class="card" style="display: none;">
            <h2>Zoning Compliance Report</h2>
            <div id="resultsArea"></div>
            <table id="resultsTable"><thead><tr><th>Section</th><th>Parameter</th><th>Details</th></tr></thead><tbody></tbody></table>
        </section>
    </div>
    <script>
        document.getElementById("generateMatrixBtn").addEventListener("click", () => {
            const district = document.getElementById("primaryDistrict").value;
            const lotArea = parseFloat(document.getElementById("lotArea").value) || 0;
            const far = district === "R10" ? 10.0 : 5.0;
            const maxSf = lotArea * far;
            
            document.getElementById("resultsArea").innerHTML = `<h3>${district} - ${maxSf.toLocaleString()} ZFA SF</h3>`;
            const tbody = document.getElementById("resultsTable").getElementsByTagName('tbody')[0];
            tbody.innerHTML = `<tr><td>FAR</td><td>Max FAR</td><td>${far}</td></tr>`;
            document.getElementById("matrixOutputWrapper").style.display = "block";
        });
    </script>
</body>
</html>
