<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Custom Zoning Matrix Builder</title>
    <style>
        :root { --primary-color: #1e3a8a; --accent-color: #0d9488; --text-main: #1f2937; --bg-main: #f3f4f6; --border-color: #e5e7eb; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background-color: var(--primary-color); color: white; padding: 20px; border-radius: 6px; text-align: center; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-top: 20px; border: 1px solid var(--border-color); }
        label { font-size: 0.8rem; font-weight: bold; color: var(--primary-color); text-transform: uppercase; display: block; margin-top: 10px; }
        select, input[type="number"] { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 4px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 15px; background: #fafafa; border: 1px solid var(--border-color); }
        .checkbox-label { font-weight: normal; text-transform: none; display: flex; align-items: center; gap: 8px; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 15px; width: 100%; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
        th { background-color: #eff6ff; color: var(--primary-color); }
        .metric-box { background-color: #fff; border: 1px solid var(--border-color); padding: 15px; border-left: 4px solid var(--primary-color); }
        .metric-val { font-size: 1.4rem; font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>NYC Zoning Matrix Builder</h1></header>
        <section class="card">
            <h2>1. Property Parameters</h2>
            <form id="zoningForm">
                <div class="grid">
                    <div><label>Primary Zoning</label><select id="primaryDistrict"><option value="R7X" selected>R7X</option><option value="R10">R10</option><option value="C4-6">C4-6</option><option value="M1">M1</option></select></div>
                    <div><label>Paired With</label><select id="pairedDistrict"><option value="None" selected>None</option><option value="M1-5/R7X">M1-5/R7X</option><option value="M1-6/R10">M1-6/R10</option></select></div>
                    <div><label>Overlay</label><select id="overlayDistrict"><option value="None">None</option><option value="C1-3">C1-3</option><option value="C2-3" selected>C2-3</option></select></div>
                    <div><label>Special District</label><select id="specialDistrict"><option value="None" selected>None</option><option value="MiD">Midtown</option><option value="DB">Downtown Brooklyn</option></select></div>
                </div>
                <div class="grid">
                    <div><label>Lot Area (SF)</label><input type="number" id="lotArea" value="10180"></div>
                    <div><label>Configuration</label><select id="lotType"><option value="Interior">Interior</option><option value="Corner">Corner</option></select></div>
                    <div><label>Transit Zone</label><select id="transitZone"><option value="Outside">Outside</option><option value="Inside" selected>Inside</option></select></div>
                </div>
                <div class="checkbox-grid">
                    <label class="checkbox-label"><input type="checkbox" id="checkYards" checked> Yards</label>
                    <label class="checkbox-label"><input type="checkbox" id="checkParking" checked> Parking</label>
                    <label class="checkbox-label"><input type="checkbox" id="checkUapUnits" checked> UAP Housing</label>
                </div>
                <button type="button" id="generateMatrixBtn">RETRIEVE COMPLIANCE MATRIX</button>
            </form>
        </section>
        <section id="matrixOutputWrapper" class="card" style="display: none;">
            <h2>Zoning Compliance Report Matrix</h2>
            <div class="grid">
                <div class="metric-box"><div class="metric-label">Base FAR</div><div id="lblStdFar" class="metric-val"></div></div>
                <div class="metric-box"><div class="metric-label">UAP FAR</div><div id="lblUapFar" class="metric-val"></div></div>
            </div>
            <table><thead><tr><th>Section</th><th>Parameter</th><th>Details</th></tr></thead><tbody id="tableBody"></tbody></table>
        </section>
    </div>
    <script>
        const rules = { "R7X": { far: 5.0, uap: 6.0 }, "R10": { far: 10.0, uap: 12.0 }, "C4-6": { far: 10.0, uap: 12.0 }, "M1": { far: 1.0, uap: 1.0 } };
        document.getElementById("generateMatrixBtn").addEventListener("click", () => {
            const p = document.getElementById("primaryDistrict").value;
            const area = parseFloat(document.getElementById("lotArea").value);
            const data = rules[p];
            document.getElementById("lblStdFar").innerText = data.far.toFixed(2);
            document.getElementById("lblUapFar").innerText = data.uap.toFixed(2);
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = `<tr><td>FAR</td><td>Max Floor Area</td><td>${(area * data.far).toLocaleString()} SF</td></tr>`;
            if(document.getElementById("checkParking").checked) tbody.innerHTML += `<tr><td>Parking</td><td>Requirement</td><td>${document.getElementById("transitZone").value === 'Inside' ? 'Waived' : 'Standard'}</td></tr>`;
            document.getElementById("matrixOutputWrapper").style.display = "block";
        });
    </script>
</body>
</html>
