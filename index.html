<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Custom Zoning Matrix Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>NYC Zoning Matrix Builder</h1>
            <p class="subtitle">Manual Parameter Configuration & Compliance Spreadsheet Generator</p>
        </div>
    </header>

    <main class="container">
        <!-- Manual Parameter Entry Form -->
        <section class="card">
            <h2>1. Configure Site Profiles & Parameters</h2>
            <p class="instruction">Fill out every zoning parameter sequentially from top to bottom before retrieving your matrix:</p>
            
            <form id="zoningForm">
                
                <!-- ROW 1: District Designations Combinations -->
                <div class="search-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 20px;">
                    <div>
                        <label for="primaryDistrict"><strong>Primary Zoning District</strong></label>
                        <select id="primaryDistrict" style="margin-top: 5px;">
                            <option value="">-- Select District --</option>
                            <optgroup label="Residential (R)">
                                <option value="R1">R1</option><option value="R2">R2</option><option value="R3">R3</option>
                                <option value="R4">R4</option><option value="R5">R5</option><option value="R6">R6</option>
                                <option value="R6B">R6B</option><option value="R7">R7</option><option value="R7-1">R7-1</option>
                                <option value="R7A">R7A</option><option value="R7X" selected>R7X</option><option value="R8">R8</option>
                                <option value="R10">R10</option>
                            </optgroup>
                            <optgroup label="Commercial (C)">
                                <option value="C1">C1 (C1-6 to C1-9)</option><option value="C2">C2 (C2-6 to C2-9)</option>
                                <option value="C4" selected>C4</option><option value="C4-6">C4-6</option>
                                <option value="C5">C5</option><option value="C6">C6</option><option value="C7">C7</option><option value="C8">C8</option>
                            </optgroup>
                            <optgroup label="Manufacturing (M)">
                                <option value="M1">M1</option><option value="M2">M2</option><option value="M3">M3</option>
                            </optgroup>
                        </select>
                    </div>

                    <div>
                        <label for="pairedDistrict"><strong>Paired With</strong></label>
                        <select id="pairedDistrict" style="margin-top: 5px;">
                            <option value="None" selected>None</option>
                            <optgroup label="Paired Manufacturing/Residential (ZR 123-11)">
                                <option value="M1-1/R5">M1-1/R5</option><option value="M1-2/R6">M1-2/R6</option>
                                <option value="M1-3/R7">M1-3/R7</option><option value="M1-4/R7A">M1-4/R7A</option>
                                <option value="M1-5/R7X">M1-5/R7X</option><option value="M1-6/R10">M1-6/R10</option>
                            </optgroup>
                        </select>
                    </div>

                    <div>
                        <label for="overlayDistrict"><strong>Overlay District</strong></label>
                        <select id="overlayDistrict" style="margin-top: 5px;">
                            <option value="None">None</option>
                            <option value="C1-1">C1-1</option><option value="C1-2">C1-2</option><option value="C1-3">C1-3</option>
                            <option value="C1-4">C1-4</option><option value="C1-5">C1-5</option><option value="C2-1">C2-1</option>
                            <option value="C2-2">C2-2</option><option value="C2-3" selected>C2-3</option><option value="C2-4">C2-4</option>
                            <option value="C2-5">C2-5</option>
                        </select>
                    </div>

                    <div>
                        <label for="specialDistrict"><strong>Special District Overrides</strong></label>
                        <select id="specialDistrict" style="margin-top: 5px;">
                            <option value="None" selected>None</option>
                            <optgroup label="Manhattan Special Districts">
                                <option value="Special Midtown District (MiD)">Special Midtown District (MiD)</option>
                                <option value="Special Lower Manhattan District (LM)">Special Lower Manhattan District (LM)</option>
                                <option value="Special Hudson Yards District (HY)">Special Hudson Yards District (HY)</option>
                                <option value="Special West Chelsea District (WCh)">Special West Chelsea District (WCh)</option>
                            </optgroup>
                            <optgroup label="Brooklyn Special Districts">
                                <option value="Special Downtown Brooklyn District (DB)">Special Downtown Brooklyn District (DB)</option>
                                <option value="Special Gowanus Mixed Use District (G)">Special Gowanus Mixed Use District (G)</option>
                                <option value="Special Greenpoint-Williamsburg District (GW)">Special Greenpoint-Williamsburg District (GW)</option>
                            </optgroup>
                            <optgroup label="Queens Special Districts">
                                <option value="Special Long Island City Mixed Use District (LIC)">Special Long Island City Mixed Use District (LIC)</option>
                                <option value="Special Flushing Waterfront District (FW)">Special Flushing Waterfront District (FW)</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <!-- ROW 2: Lot Boundaries Geometry and Configurations -->
                <div class="search-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 20px; gap: 20px;">
                    <div>
                        <label for="lotArea"><strong>Lot Area (Square Footage Value)</strong></label>
                        <input type="number" id="lotArea" placeholder="e.g. 10180" value="10180" style="margin-top: 5px;">
                    </div>
                    <div>
                        <label for="lotType"><strong>Lot Boundary Configuration</strong></label>
                        <select id="lotType" style="margin-top: 5px;">
                            <option value="Corner Lot">Corner Lot</option>
                            <option value="Interior Lot" selected>Interior Lot</option>
                            <option value="Through Lot">Through Lot</option>
                            <option value="Mixed/Combination Lot">Mixed / Combination Lot</option>
                        </select>
                    </div>
                </div>

                <!-- ROW 3: Multi-Use Track Flag Options -->
                <div class="search-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 20px;">
                    <div>
                        <label for="trackRes"><strong>Residential Tracking Flag</strong></label>
                        <select id="trackRes" style="margin-top: 5px;">
                            <option value="None">None (No Residential)</option>
                            <option value="Residential" selected>Residential Track Enabled (UG II)</option>
                        </select>
                    </div>
                    <div>
                        <label for="trackCf"><strong>Community Facility Tracking Flag</strong></label>
                        <select id="trackCf" style="margin-top: 5px;">
                            <option value="None" selected>None (No Facilities)</option>
                            <option value="CommunityFacility">Community Facility Enabled (UG III-IV)</option>
                        </select>
                    </div>
                    <div>
                        <label for="trackComm"><strong>Commercial Tracking Flag</strong></label>
                        <select id="trackComm" style="margin-top: 5px;">
                            <option value="None">None (No Commercial Retail)</option>
                            <option value="Commercial" selected>Commercial Track Enabled (UG VI)</option>
                        </select>
                    </div>
                </div>

                <!-- ROW 4: Transit Zone Framework Requirements -->
                <div class="search-grid" style="grid-template-columns: 1fr; margin-bottom: 20px;">
                    <div>
                        <label for="transitZone"><strong>Transit Zone Proximity Status</strong></label>
                        <select id="transitZone" style="margin-top: 5px;">
                            <option value="Outside Transit Zone">Outside Transit Zone (Standard Ratios Apply)</option>
                            <option value="Within Inner Transit Zone" selected>Within Inner Transit Zone (Parking Exemptions Active)</option>
                        </select>
                    </div>
                </div>

                <!-- ROW 5: Streetscape Tier and Frontage Counters -->
                <div class="search-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 20px; gap: 20px;">
                    <div>
