<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Custom Zoning Matrix Builder</title>
    <style>
        :root { --primary-color: #1e3a8a; --primary-light: #eff6ff; --accent-color: #0d9488; --text-main: #1f2937; --text-muted: #4b5563; --bg-main: #f3f4f6; --border-color: #e5e7eb; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background-color: var(--primary-color); color: white; padding: 20px; border-radius: 6px; text-align: center; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-top: 20px; border: 1px solid var(--border-color); }
        h2 { margin-top: 0; color: var(--primary-color); }
        label { font-size: 0.8rem; font-weight: bold; color: var(--primary-color); text-transform: uppercase; display: block; margin-bottom: 4px; }
        select, input { width: 100%; padding: 10px; border: 2px solid var(--border-color); border-radius: 4px; box-sizing: border-box; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 15px; width: 100%; font-size: 1.1rem; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        th { background-color: var(--primary-light); }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>NYC Zoning Matrix Builder</h1></header>
        <section class="card">
            <h2>1. Property Parameters</h2>
            <form id="zoningForm">
                <div class="search-grid">
                    <div><label>District</label><select id="primaryDistrict"><option value="R7X" selected>R7X</option><option value="R10">R10</option></select></div>
                    <div><label>Lot Area (SF)</label><input type="number" id="lotArea" value="10180"></div>
                    <div><label>Lot Type</label><select id="lotType"><option>Corner Lot</option><option selected>Interior Lot</option></select></div>
                    <div><label>Streetscape</label><select id="streetscapeTier"><option>Tier 1</option><option>Tier 2</option></select></div>
                </div>
                <div class="search-grid">
                    <div><label>Balconies</label><select id="hasBalconies"><option value="No">No</option><option value="Yes">Yes</option></select></div>
                    <div><label>Wall Width (ft)</label><input type="number" id="balconyWallTotal" value="60"></div>
                </div>
                <div class="checkbox-grid">
                    <label><input type="checkbox" id="checkYards" checked> Yards</label>
                    <label><input type="checkbox" id="checkParking" checked> Parking</label>
                </div>
                <button type="button" id="retrieveBtn">Calculate Matrix</button>
            </form>
        </section>
        <section id="matrixOutputWrapper" class="card" style="display: none;">
            <h2>Compliance Report</h2>
            <div id="outZoning"></div>
            <table id="resultsTable"><thead><tr><th>ZR Section</th><th>Parameter</th><th>Value</th></tr></thead><tbody id="tableBody"></tbody></table>
        </section>
    </div>
    <script>
        document.getElementById("retrieveBtn").addEventListener("click", () => {
            const lotArea = parseFloat(document.getElementById("lotArea").value);
            const far = 5.0; // Simplified for fix
            document.getElementById("tableBody").innerHTML = `<tr><td>FAR</td><td>Max Floor Area</td><td>${(lotArea * far).toLocaleString()} SF</td></tr>`;
            document.getElementById("matrixOutputWrapper").style.display = "block";
        });
    </script>
</body>
</html>
